<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Feedback</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  "https://wdshlmngpxxkduyzqjhx.supabase.co",
  "sb_publishable_yu27RAR9CaloFRv3_LGlXA_k9UemqxG"
);
</script>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#dbe9ff)}
.container{max-width:650px;margin:30px auto;padding:20px}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h1{text-align:center;margin:0 0 15px}
.logo{text-align:center;font-size:46px;cursor:pointer}
.stars{text-align:center;font-size:42px;margin:15px 0}
.star{cursor:pointer;color:#bbb;transition:.2s}
.star.active{color:#ffbf00;transform:scale(1.15)}
input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:12px;border:1px solid #ccc;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#0a6cff;color:#fff;font-size:16px;cursor:pointer}
button:hover{background:#0055dd}
#admin{display:none}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ddd;padding:8px}
blockquote{background:#f4f8ff;border-left:4px solid #0a6cff;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div class="container">
<div class="card" id="formCard">
<div class="logo" id="logo">⭐</div>
<h1>Customer Feedback</h1>
<p style="text-align:center">Vielen Dank, dass Sie sich kurz Zeit für eine Bewertung nehmen.</p>
<div class="stars" id="stars"></div>
<input id="name" placeholder="Ihr Name">
<input id="company" placeholder="Firma">
<textarea id="comment" rows="4" placeholder="Ihr Feedback"></textarea>

<button onclick="saveFeedback()">Feedback absenden</button>

<hr style="margin:25px 0;">

<p style="text-align:center;">
    <a href="reviews.html">⭐⭐⭐⭐⭐ Kundenempfehlungen ansehen</a>
</p>

</div>

<div class="card" id="admin">
<h2>Admin Dashboard</h2>
<p id="stats"></p>
<input id="search" placeholder="Suchen..." oninput="renderAdmin()">
<canvas id="chart" height="120"></canvas>
<h3>Positive Kundenstimmen</h3>
<div id="quotes"></div>
<table>
<thead><tr><th>Datum</th><th>Name</th><th>Firma</th><th>Sterne</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
<button onclick="exportJSON()">Backup herunterladen</button>
</div>
</div>

<script>
let rating=0, taps=0, chart;

const stars=document.getElementById("stars");
for(let i=1;i<=5;i++){
 const s=document.createElement("span");
 s.className="star";
 s.innerHTML="★";
 s.onclick=()=>{
   rating=i;
   [...stars.children].forEach((x,j)=>x.className=j<i?"star active":"star");
 };
 stars.appendChild(s);
}

logo.onclick=()=>{
 taps++;
 if(taps>=7){
   taps=0;
   const pin=prompt("PIN eingeben");
   if(pin==="2208"){
      formCard.style.display="none";
      admin.style.display="block";
      renderAdmin();
   }
 }
}

function getData(){
 return JSON.parse(localStorage.getItem("customer_feedback")||"[]");
}

async function saveFeedback(){
 if(rating===0){alert("Bitte Sterne auswählen.");return;}
 const entry={
   datum:new Date().toLocaleString("de-DE"),
   name:document.getElementById("name").value.trim(),
   firma:document.getElementById("company").value.trim(),
   kommentar:document.getElementById("comment").value.trim(),
   sterne:rating
 };
 let data=getData();
 data.push(entry);
 localStorage.setItem("customer_feedback",JSON.stringify(data));try{
    const { error } = await supabase
        .from("feedback")
        .insert([{
            name: entry.name,
            firma: entry.firma,
            kommentar: entry.kommentar,
            sterne: entry.sterne
        }]);

    if(error){
        console.error(error);
        alert("Feedback wurde lokal gespeichert, konnte aber nicht in die Cloud übertragen werden.");
    }
}catch(e){
    console.error(e);
 }
 alert("Vielen Dank für Ihr Feedback!");
 document.getElementById("name").value="";
 document.getElementById("company").value="";
 document.getElementById("comment").value="";
 rating=0;
 [...stars.children].forEach(x=>x.className="star");
}

function renderAdmin(){
 const q=document.getElementById("search").value.toLowerCase();
 const all=getData();
 const data=all.filter(x=>!q||x.name.toLowerCase().includes(q)||x.firma.toLowerCase().includes(q));
 const avg=data.length?data.reduce((a,b)=>a+b.sterne,0)/data.length:0;
 stats.textContent=`Bewertungen: ${data.length} | Durchschnitt: ${avg.toFixed(2)} | Kundenzufriedenheit: ${(avg/5*100).toFixed(0)}%`;
 tbody.innerHTML="";
 quotes.innerHTML="";
 let dist=[0,0,0,0,0];
 data.forEach(x=>{
   dist[x.sterne-1]++;
   tbody.innerHTML+=`<tr><td>${x.datum}</td><td>${x.name||"-"}</td><td>${x.firma||"-"}</td><td>${x.sterne}</td></tr>`;
   if(x.sterne>=4 && x.kommentar){
      quotes.innerHTML+=`<blockquote>"${x.kommentar}"<br><small>${x.name||"Anonym"}${x.firma?" – "+x.firma:""}</small></blockquote>`;
   }
 });
 if(chart)chart.destroy();
 chart=new Chart(document.getElementById("chart"),{
   type:"bar",
   data:{labels:["1","2","3","4","5"],datasets:[{label:"Sterne",data:dist}]},
   options:{plugins:{legend:{display:false}}}
 });
}

function exportJSON(){
 const blob=new Blob([JSON.stringify(getData(),null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="customer-feedback-backup.json";
 a.click();
}
</script>
</body>
</html>
